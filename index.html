
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Desktop</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Tahoma, Arial, sans-serif;
}

/* Windows XP 배경 */
.desktop {
  width: 100vw;
  height: 100vh;
  background: linear-gradient(
    to bottom,
    #168bd5 0%,
    #73c9ef 48%,
    #9acb52 49%,
    #367b22 100%
  );
  position: relative;
}

/* 바탕화면 아이콘 */
.icon {
  width: 90px;
  text-align: center;
  position: absolute;
  color: white;
  text-shadow: 1px 1px 2px #333;
  cursor: pointer;
  padding: 8px;
  border: 1px solid transparent;
}

.icon:hover {
  background: rgba(100,160,255,0.3);
  border: 1px solid rgba(255,255,255,0.5);
}

.icon img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  display: block;
  margin: auto auto 5px;
}

.trash {
  top: 15px;
  left: 15px;
}

/* 이미지 파일 */
.image-file {
  width: 110px;
}

.image-file img {
  width: 80px;
  height: 65px;
  object-fit: cover;
  border: 2px solid white;
  box-shadow: 1px 2px 4px #333;
}

.file1 { top: 25px; left: 150px; }
.file2 { top: 130px; left: 150px; }
.file3 { top: 235px; left: 150px; }
.file4 { top: 340px; left: 150px; }

/* XP 작업 표시줄 */
.taskbar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 42px;
  background: linear-gradient(#245edb, #123eaa);
  border-top: 2px solid #76a9ff;
  display: flex;
  align-items: center;
}

.start {
  background: linear-gradient(#67c94e, #218b25);
  color: white;
  font-weight: bold;
  font-style: italic;
  padding: 10px 24px;
  border-radius: 0 12px 12px 0;
}

/* 이미지 미리보기 창 */
.window {
  display: none;
  position: absolute;
  width: min(600px, 90vw);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #ece9d8;
  border: 2px solid #245edb;
  box-shadow: 3px 5px 15px #222;
}

.titlebar {
  background: linear-gradient(#3986ee, #0750b8);
  color: white;
  padding: 8px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

.close {
  cursor: pointer;
  background: #e44;
  border: 1px solid white;
  color: white;
  padding: 1px 9px;
  font-weight: bold;
}

.preview {
  padding: 12px;
  text-align: center;
}

.preview img {
  max-width: 100%;
  max-height: 65vh;
  object-fit: contain;
}

</style>
</head>

<body>

<div class="desktop">

  <!-- 휴지통 -->
  <div class="icon trash">
    <img src="https://img.icons8.com/color/96/waste.png">
    휴지통
  </div>

  <!-- 이미지 파일 -->
  <div class="icon image-file file1"
       ondblclick="openImage(0)">
    <img src="https://picsum.photos/seed/desktop1/400/300">
    image_01.jpg
  </div>

  <div class="icon image-file file2"
       ondblclick="openImage(1)">
    <img src="https://picsum.photos/seed/desktop2/400/300">
    image_02.jpg
  </div>

  <div class="icon image-file file3"
       ondblclick="openImage(2)">
    <img src="https://picsum.photos/seed/desktop3/400/300">
    image_03.jpg
  </div>

  <div class="icon image-file file4"
       ondblclick="openImage(3)">
    <img src="https://picsum.photos/seed/desktop4/400/300">
    image_04.jpg
  </div>

  <!-- 이미지 미리보기 -->
  <div class="window" id="window">
    <div class="titlebar">
      <span id="filename">Image Viewer</span>
      <button class="close" onclick="closeImage()">X</button>
    </div>
    <div class="preview">
      <img id="largeImage" src="">
    </div>
  </div>

  <!-- 작업 표시줄 -->
  <div class="taskbar">
    <div class="start">Start</div>
  </div>

</div>

<script>
const images = [
  "https://picsum.photos/seed/desktop1/1000/700",
  "https://picsum.photos/seed/desktop2/1000/700",
  "https://picsum.photos/seed/desktop3/1000/700",
  "https://picsum.photos/seed/desktop4/1000/700"
];

function openImage(index) {
  document.getElementById("largeImage").src = images[index];
  document.getElementById("filename").textContent =
    "image_0" + (index + 1) + ".jpg";

  document.getElementById("window").style.display = "block";
}

function closeImage() {
  document.getElementById("window").style.display = "none";
}
</script>

</body>
</html>
